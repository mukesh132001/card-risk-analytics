version: 2

sources:
  - name: raw
    tables:
      - name: transactions

models:
  - name: stg_transactions
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: amount_usd
        tests: [not_null]
      - name: merchant_category
        tests:
          - accepted_values:
              values: [grocery, travel, dining, fuel, retail, online, utilities]
