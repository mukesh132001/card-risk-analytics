# Local PostgreSQL for card-risk-analytics.
#   docker compose up -d      start
#   docker compose down       stop (data is kept in the pgdata volume)
services:
  postgres:
    image: postgres:16
    container_name: cardrisk-postgres
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
      POSTGRES_DB: cardrisk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card -d cardrisk"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
